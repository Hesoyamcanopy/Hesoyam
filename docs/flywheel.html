<!doctype html><meta charset="utf-8"><style>html,body{margin:0;padding:0;background:#0e1109;width:2100px;height:4773px;overflow:hidden}svg{display:block}</style><svg xmlns="http://www.w3.org/2000/svg" width="2100" height="4773" viewBox="0 0 2100 4773"><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f5c542"/></marker><marker id="headCash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5fbf4a"/></marker><marker id="headAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e0913a"/></marker></defs><rect width="2100" height="4773" fill="#0e1109"/>
<text x="70" y="92" font-family="'Arial Black','Segoe UI',Impact,sans-serif" font-size="62" font-weight="900" fill="#f5c542" text-anchor="start">HESOYAM CANOPY</text>
<text x="70" y="140" font-family="'Segoe UI',Arial,sans-serif" font-size="32" font-weight="600" fill="#f4f1e0" text-anchor="start">The flywheel, every step</text>
<text x="70" y="180" font-family="'Segoe UI',Arial,sans-serif" font-size="21" font-weight="400" fill="#b9b89a" text-anchor="start">Read it top to bottom. A player spends, the spending becomes revenue, one contract splits that revenue by a published rule, and the</text>
<text x="70" y="210.45" font-family="'Segoe UI',Arial,sans-serif" font-size="21" font-weight="400" fill="#b9b89a" text-anchor="start">two rails pay it back out in a way that makes playing worth more. Nothing is minted to pay anyone.</text>
<rect x="70" y="228" width="1960" height="4" fill="#f5c542"/>
<text x="70" y="300" font-family="'Arial Black','Segoe UI',Impact,sans-serif" font-size="40" font-weight="900" fill="#9ad34a" text-anchor="start" letter-spacing="1">1. WHAT A PLAYER ACTUALLY DOES</text>
<text x="70" y="334" font-family="'Segoe UI',Arial,sans-serif" font-size="20" font-weight="400" fill="#83866a" text-anchor="start">Nine steps. Seven of them charge a fee, and that fee is the only source of everything below.</text>
<rect x="70" y="352" width="1960" height="3" fill="#9ad34a" opacity="0.5"/>
<rect x="70" y="384" width="626.6666666666666" height="218" rx="0" fill="#161a0f" stroke="#414d2e" stroke-width="2"/>
<rect x="70" y="384" width="6" height="218" fill="#f5c542"/>
<text x="96" y="436" font-family="'Arial Black','Segoe UI',Impact,sans-serif" font-size="42" font-weight="900" fill="#f5c542" text-anchor="start">1</text>
<text x="148" y="432" font-family="'Segoe UI',Arial,sans-serif" font-size="25" font-weight="700" fill="#f4f1e0" text-anchor="start">Buy a bench</text>
<text x="148" y="460" font-family="'Consolas','Courier New',monospace" font-size="16" font-weight="400" fill="#83866a" text-anchor="start">GrowBench.buy(tranche)</text>
<text x="96" y="500" font-family="'Segoe UI',Arial,sans-serif" font-size="17.5" font-weight="400" fill="#b9b89a" text-anchor="start">The whole purchase price is protocol revenue. Higher tranches</text>
<text x="96" y="525.375" font-family="'Segoe UI',Arial,sans-serif" font-size="17.5" font-weight="400" fill="#b9b89a" text-anchor="start">score better on environment control.</text>
<text x="674.6666666666666" y="416" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#f5c542" text-anchor="end" letter-spacing="1.5">PAYS A FEE</text>
<rect x="736.6666666666666" y="384" width="626.6666666666666" height="218" rx="0" fill="#161a0f" stroke="#414d2e" stroke-width="2"/>
<rect x="736.6666666666666" y="384" width="6" height="218" fill="#f5c542"/>
<text x="762.6666666666666" y="436" font-family="'Arial Black','Segoe UI',Impact,sans-serif" font-size="42" font-weight="900" fill="#f5c542" text-anchor="start">2</text>
<text x="814.6666666666666" y="432" font-family="'Segoe UI',Arial,sans-serif" font-size="25" font-weight="700" fill="#f4f1e0" text-anchor="start">Site it on a plot</text>
<text x="814.6666666666666" y="460" font-family="'Consolas','Courier New',monospace" font-size="16" font-weight="400" fill="#83866a" text-anchor="start">Plot.site(plot, bench, days)</text>
<text x="762.6666666666666" y="500" font-family="'Segoe UI',Arial,sans-serif" font-size="17.5" font-weight="400" fill="#b9b89a" text-anchor="start">Rent for the days you want. Splits 70 percent to the plot</text>
<text x="762.6666666666666" y="525.375" font-family="'Segoe UI',Arial,sans-serif" font-size="17.5" font-weight="400" fill="#b9b89a" text-anchor="start">owner, 30 percent to the router.</text>
<text x="1341.3333333333333" y="416" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#f5c542" text-anchor="end" letter-spacing="1.5">PAYS A FEE</text>
<rect x="1403.3333333333333" y="384" width="626.6666666666666" height="218" rx="0" fill="#161a0f" stroke="#414d2e" stroke-width="2"/>
<rect x="1403.3333333333333" y="384" width="6" height="218" fill="#f5c542"/>
<text x="1429.3333333333333" y="436" font-family="'Arial Black','Segoe UI',Impact,sans-serif" font-size="42" font-weight="900" fill="#f5c542" text-anchor="start">3</text>
<text x="1481.3333333333333" y="432" font-family="'Segoe UI',Arial,sans-serif" font-size="25" font-weight="700" fill="#f4f1e0" text-anchor="start">Plant</text>
<text x="1481.3333333333333" y="460" font-family="'Consolas','Courier New',monospace" font-size="16" font-weight="400" fill="#83866a" text-anchor="start">GrowGame.plant(bench, strain)</text>
<text x="1429.3333333333333" y="500" font-family="'Segoe UI',Arial,sans-serif" font-size="17.5" font-weight="400" fill="#b9b89a" text-anchor="start">Seed fee. The whole event schedule is fixed and visible at</text>
<text x="1429.3333333333333" y="525.375" font-family="'Segoe UI',Arial,sans-serif" font-size="17.5" font-weight="400" fill="#b9b89a" text-anchor="start">planting, so responding is a decision, not a coin flip.</text>
<text x="2008" y="416" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#f5c542" text-anchor="end" letter-spacing="1.5">PAYS A FEE</text>
<rect x="70" y="628" width="626.6666666666666" height="218" rx="0" fill="#161a0f" stroke="#414d2e" stroke-width="2"/>
<rect x="70" y="628" width="6" height="218" fill="#f5c542"/>
<text x="96" y="680" font-family="'Arial Black','Segoe UI',Impact,sans-serif" font-size="42" font-weight="900" fill="#f5c542" text-anchor="start">4</text>
<text x="148" y="676" font-family="'Segoe UI',Arial,sans-serif" font-size="25" font-weight="700" fill="#f4f1e0" text-anchor="start">Feed, three windows</text>
<text x="148" y="704" font-family="'Consolas','Courier New',monospace" font-size="16" font-weight="400" fill="#83866a" text-anchor="start">GrowGame.feed(grow, window)</text>
<text x="96" y="744" font-family="'Segoe UI',Arial,sans-serif" font-size="17.5" font-weight="400" fill="#b9b89a" text-anchor="start">One nutrient fee per window, each a day wide. Hitting all</text>
<text x="96" y="769.375" font-family="'Segoe UI',Arial,sans-serif" font-size="17.5" font-weight="400" fill="#b9b89a" text-anchor="start">three is 40 of your 100 care points.</text>
<text x="674.6666666666666" y="660" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#f5c542" text-anchor="end" letter-spacing="1.5">PAYS A FEE</text>
<rect x="736.6666666666666" y="628" width="626.6666666666666" height="218" rx="0" fill="#161a0f" stroke="#414d2e" stroke-width="2"/>
<rect x="736.6666666666666" y="628" width="6" height="218" fill="#f5c542"/>
<text x="762.6666666666666" y="680" font-family="'Arial Black','Segoe UI',Impact,sans-serif" font-size="42" font-weight="900" fill="#f5c542" text-anchor="start">5</text>
<text x="814.6666666666666" y="676" font-family="'Segoe UI',Arial,sans-serif" font-size="25" font-weight="700" fill="#f4f1e0" text-anchor="start">Treat what goes wrong</text>
<text x="814.6666666666666" y="704" font-family="'Consolas','Courier New',monospace" font-size="16" font-weight="400" fill="#83866a" text-anchor="start">GrowGame.treat(grow, event)</text>
<text x="762.6666666666666" y="744" font-family="'Segoe UI',Arial,sans-serif" font-size="17.5" font-weight="400" fill="#b9b89a" text-anchor="start">Mites, mould, heat. Treatment fee each. Ignore one and you</text>
<text x="762.6666666666666" y="769.375" font-family="'Segoe UI',Arial,sans-serif" font-size="17.5" font-weight="400" fill="#b9b89a" text-anchor="start">lose yield you cannot get back.</text>
<text x="1341.3333333333333" y="660" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#f5c542" text-anchor="end" letter-spacing="1.5">PAYS A FEE</text>
<rect x="1403.3333333333333" y="628" width="626.6666666666666" height="218" rx="0" fill="#161a0f" stroke="#414d2e" stroke-width="2"/>
<rect x="1403.3333333333333" y="628" width="6" height="218" fill="#f5c542"/>
<text x="1429.3333333333333" y="680" font-family="'Arial Black','Segoe UI',Impact,sans-serif" font-size="42" font-weight="900" fill="#f5c542" text-anchor="start">6</text>
<text x="1481.3333333333333" y="676" font-family="'Segoe UI',Arial,sans-serif" font-size="25" font-weight="700" fill="#f4f1e0" text-anchor="start">Pay utilities</text>
<text x="1481.3333333333333" y="704" font-family="'Consolas','Courier New',monospace" font-size="16" font-weight="400" fill="#83866a" text-anchor="start">charged at harvest</text>
<text x="1429.3333333333333" y="744" font-family="'Segoe UI',Arial,sans-serif" font-size="17.5" font-weight="400" fill="#b9b89a" text-anchor="start">Utility per day across the whole cycle. Light and water are</text>
<text x="1429.3333333333333" y="769.375" font-family="'Segoe UI',Arial,sans-serif" font-size="17.5" font-weight="400" fill="#b9b89a" text-anchor="start">not free.</text>
<text x="2008" y="660" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#f5c542" text-anchor="end" letter-spacing="1.5">PAYS A FEE</text>
<rect x="70" y="872" width="626.6666666666666" height="218" rx="0" fill="#161a0f" stroke="#9ad34a" stroke-width="2"/>
<rect x="70" y="872" width="6" height="218" fill="#9ad34a"/>
<text x="96" y="924" font-family="'Arial Black','Segoe UI',Impact,sans-serif" font-size="42" font-weight="900" fill="#9ad34a" text-anchor="start">7</text>
<text x="148" y="920" font-family="'Segoe UI',Arial,sans-serif" font-size="25" font-weight="700" fill="#f4f1e0" text-anchor="start">Harvest on day seven</text>
<text x="148" y="948" font-family="'Consolas','Courier New',monospace" font-size="16" font-weight="400" fill="#83866a" text-anchor="start">GrowGame.harvest(grow)</text>
<text x="96" y="988" font-family="'Segoe UI',Arial,sans-serif" font-size="17.5" font-weight="400" fill="#b9b89a" text-anchor="start">Yield is a pure function of care, bench tier and strain. Care</text>
<text x="96" y="1013.375" font-family="'Segoe UI',Arial,sans-serif" font-size="17.5" font-weight="400" fill="#b9b89a" text-anchor="start">0 pays 55 percent of base. Care 100 pays all of it.</text>
<rect x="736.6666666666666" y="872" width="626.6666666666666" height="218" rx="0" fill="#161a0f" stroke="#414d2e" stroke-width="2"/>
<rect x="736.6666666666666" y="872" width="6" height="218" fill="#f5c542"/>
<text x="762.6666666666666" y="924" font-family="'Arial Black','Segoe UI',Impact,sans-serif" font-size="42" font-weight="900" fill="#f5c542" text-anchor="start">8</text>
<text x="814.6666666666666" y="920" font-family="'Segoe UI',Arial,sans-serif" font-size="25" font-weight="700" fill="#f4f1e0" text-anchor="start">Cure, two days</text>
<text x="814.6666666666666" y="948" font-family="'Consolas','Courier New',monospace" font-size="16" font-weight="400" fill="#83866a" text-anchor="start">GrowGame.cure(harvest)</text>
<text x="762.6666666666666" y="988" font-family="'Segoe UI',Arial,sans-serif" font-size="17.5" font-weight="400" fill="#b9b89a" text-anchor="start">Cure fee. Worth up to 12 quality points, and quality is what</text>
<text x="762.6666666666666" y="1013.375" font-family="'Segoe UI',Arial,sans-serif" font-size="17.5" font-weight="400" fill="#b9b89a" text-anchor="start">decides which tier your Flower lands in.</text>
<text x="1341.3333333333333" y="904" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#f5c542" text-anchor="end" letter-spacing="1.5">PAYS A FEE</text>
<rect x="1403.3333333333333" y="872" width="626.6666666666666" height="218" rx="0" fill="#161a0f" stroke="#9ad34a" stroke-width="2"/>
<rect x="1403.3333333333333" y="872" width="6" height="218" fill="#9ad34a"/>
<text x="1429.3333333333333" y="924" font-family="'Arial Black','Segoe UI',Impact,sans-serif" font-size="42" font-weight="900" fill="#9ad34a" text-anchor="start">9</text>
<text x="1481.3333333333333" y="920" font-family="'Segoe UI',Arial,sans-serif" font-size="25" font-weight="700" fill="#f4f1e0" text-anchor="start">Collect the Flower</text>
<text x="1481.3333333333333" y="948" font-family="'Consolas','Courier New',monospace" font-size="16" font-weight="400" fill="#83866a" text-anchor="start">GrowGame.collect(harvest)</text>
<text x="1429.3333333333333" y="988" font-family="'Segoe UI',Arial,sans-serif" font-size="17.5" font-weight="400" fill="#b9b89a" text-anchor="start">ERC-1155 Flower minted to you, id = strain * 4 + tier. Now</text>
<text x="1429.3333333333333" y="1013.375" font-family="'Segoe UI',Arial,sans-serif" font-size="17.5" font-weight="400" fill="#b9b89a" text-anchor="start">you have something to sell or to burn.</text>
<line x1="1050" y1="1132" x2="1050" y2="1192" stroke="#f5c542" stroke-width="5" marker-end="url(#head)"/>
<text x="1074" y="1174" font-family="'Segoe UI',Arial,sans-serif" font-size="19" font-weight="600" fill="#f5c542" text-anchor="start">every fee above goes to one place</text>
<text x="70" y="1232" font-family="'Arial Black','Segoe UI',Impact,sans-serif" font-size="40" font-weight="900" fill="#f5c542" text-anchor="start" letter-spacing="1">2. WHERE THE MONEY ENTERS</text>
<text x="70" y="1266" font-family="'Segoe UI',Arial,sans-serif" font-size="20" font-weight="400" fill="#83866a" text-anchor="start">Eleven fee lines, all of them somebody paying for something they wanted. None of them is a deposit.</text>
<rect x="70" y="1284" width="1960" height="3" fill="#f5c542" opacity="0.5"/>
<rect x="70" y="1316" width="633.3333333333334" height="100" rx="0" fill="#1f2516" stroke="#2c3520" stroke-width="2"/>
<text x="92" y="1354" font-family="'Segoe UI',Arial,sans-serif" font-size="22" font-weight="700" fill="#f4f1e0" text-anchor="start">Token transfer tax</text>
<text x="681.3333333333334" y="1354" font-family="'Consolas','Courier New',monospace" font-size="24" font-weight="700" fill="#f5c542" text-anchor="end">3.0%</text>
<text x="92" y="1380" font-family="'Segoe UI',Arial,sans-serif" font-size="16" font-weight="400" fill="#83866a" text-anchor="start">2% to the router, 1% to the platform. Every transfer, unless both</text>
<text x="92" y="1403.2" font-family="'Segoe UI',Arial,sans-serif" font-size="16" font-weight="400" fill="#83866a" text-anchor="start">ends are exempt.</text>
<rect x="733.3333333333334" y="1316" width="633.3333333333334" height="100" rx="0" fill="#1f2516" stroke="#2c3520" stroke-width="2"/>
<text x="755.3333333333334" y="1354" font-family="'Segoe UI',Arial,sans-serif" font-size="22" font-weight="700" fill="#f4f1e0" text-anchor="start">Bench sale</text>
<text x="1344.6666666666667" y="1354" font-family="'Consolas','Courier New',monospace" font-size="24" font-weight="700" fill="#f5c542" text-anchor="end">100%</text>
<text x="755.3333333333334" y="1380" font-family="'Segoe UI',Arial,sans-serif" font-size="16" font-weight="400" fill="#83866a" text-anchor="start">The entire price of a bench is revenue.</text>
<rect x="1396.6666666666667" y="1316" width="633.3333333333334" height="100" rx="0" fill="#1f2516" stroke="#2c3520" stroke-width="2"/>
<text x="1418.6666666666667" y="1354" font-family="'Segoe UI',Arial,sans-serif" font-size="22" font-weight="700" fill="#f4f1e0" text-anchor="start">Seed fee</text>
<text x="2008" y="1354" font-family="'Consolas','Courier New',monospace" font-size="24" font-weight="700" fill="#f5c542" text-anchor="end">per plant</text>
<text x="1418.6666666666667" y="1380" font-family="'Segoe UI',Arial,sans-serif" font-size="16" font-weight="400" fill="#83866a" text-anchor="start">Charged when a grow starts.</text>
<rect x="70" y="1432" width="633.3333333333334" height="100" rx="0" fill="#1f2516" stroke="#2c3520" stroke-width="2"/>
<text x="92" y="1470" font-family="'Segoe UI',Arial,sans-serif" font-size="22" font-weight="700" fill="#f4f1e0" text-anchor="start">Nutrients</text>
<text x="681.3333333333334" y="1470" font-family="'Consolas','Courier New',monospace" font-size="24" font-weight="700" fill="#f5c542" text-anchor="end">x3</text>
<text x="92" y="1496" font-family="'Segoe UI',Arial,sans-serif" font-size="16" font-weight="400" fill="#83866a" text-anchor="start">One fee per feeding window.</text>
<rect x="733.3333333333334" y="1432" width="633.3333333333334" height="100" rx="0" fill="#1f2516" stroke="#2c3520" stroke-width="2"/>
<text x="755.3333333333334" y="1470" font-family="'Segoe UI',Arial,sans-serif" font-size="22" font-weight="700" fill="#f4f1e0" text-anchor="start">Treatment</text>
<text x="1344.6666666666667" y="1470" font-family="'Consolas','Courier New',monospace" font-size="24" font-weight="700" fill="#f5c542" text-anchor="end">per event</text>
<text x="755.3333333333334" y="1496" font-family="'Segoe UI',Arial,sans-serif" font-size="16" font-weight="400" fill="#83866a" text-anchor="start">Charged when you respond to a pest or heat event.</text>
<rect x="1396.6666666666667" y="1432" width="633.3333333333334" height="100" rx="0" fill="#1f2516" stroke="#2c3520" stroke-width="2"/>
<text x="1418.6666666666667" y="1470" font-family="'Segoe UI',Arial,sans-serif" font-size="22" font-weight="700" fill="#f4f1e0" text-anchor="start">Utilities</text>
<text x="2008" y="1470" font-family="'Consolas','Courier New',monospace" font-size="24" font-weight="700" fill="#f5c542" text-anchor="end">per day</text>
<text x="1418.6666666666667" y="1496" font-family="'Segoe UI',Arial,sans-serif" font-size="16" font-weight="400" fill="#83866a" text-anchor="start">Accrues across the cycle, settled at harvest.</text>
<rect x="70" y="1548" width="633.3333333333334" height="100" rx="0" fill="#1f2516" stroke="#2c3520" stroke-width="2"/>
<text x="92" y="1586" font-family="'Segoe UI',Arial,sans-serif" font-size="22" font-weight="700" fill="#f4f1e0" text-anchor="start">Cure fee</text>
<text x="681.3333333333334" y="1586" font-family="'Consolas','Courier New',monospace" font-size="24" font-weight="700" fill="#f5c542" text-anchor="end">per cure</text>
<text x="92" y="1612" font-family="'Segoe UI',Arial,sans-serif" font-size="16" font-weight="400" fill="#83866a" text-anchor="start">Only paid if you choose to cure.</text>
<rect x="733.3333333333334" y="1548" width="633.3333333333334" height="100" rx="0" fill="#1f2516" stroke="#2c3520" stroke-width="2"/>
<text x="755.3333333333334" y="1586" font-family="'Segoe UI',Arial,sans-serif" font-size="22" font-weight="700" fill="#f4f1e0" text-anchor="start">Marketplace take</text>
<text x="1344.6666666666667" y="1586" font-family="'Consolas','Courier New',monospace" font-size="24" font-weight="700" fill="#f5c542" text-anchor="end">4.0%</text>
<text x="755.3333333333334" y="1612" font-family="'Segoe UI',Arial,sans-serif" font-size="16" font-weight="400" fill="#83866a" text-anchor="start">On every peer to peer Flower fill.</text>
<rect x="1396.6666666666667" y="1548" width="633.3333333333334" height="100" rx="0" fill="#1f2516" stroke="#2c3520" stroke-width="2"/>
<text x="1418.6666666666667" y="1586" font-family="'Segoe UI',Arial,sans-serif" font-size="22" font-weight="700" fill="#f4f1e0" text-anchor="start">Card craft fee</text>
<text x="2008" y="1586" font-family="'Consolas','Courier New',monospace" font-size="24" font-weight="700" fill="#f5c542" text-anchor="end">per craft</text>
<text x="1418.6666666666667" y="1612" font-family="'Segoe UI',Arial,sans-serif" font-size="16" font-weight="400" fill="#83866a" text-anchor="start">Paid on top of the Flower that gets burned.</text>
<rect x="70" y="1664" width="633.3333333333334" height="100" rx="0" fill="#1f2516" stroke="#2c3520" stroke-width="2"/>
<text x="92" y="1702" font-family="'Segoe UI',Arial,sans-serif" font-size="22" font-weight="700" fill="#f4f1e0" text-anchor="start">Plot rent cut</text>
<text x="681.3333333333334" y="1702" font-family="'Consolas','Courier New',monospace" font-size="24" font-weight="700" fill="#f5c542" text-anchor="end">30%</text>
<text x="92" y="1728" font-family="'Segoe UI',Arial,sans-serif" font-size="16" font-weight="400" fill="#83866a" text-anchor="start">The protocol's share of what a grower pays a plot owner.</text>
<rect x="733.3333333333334" y="1664" width="633.3333333333334" height="100" rx="0" fill="#1f2516" stroke="#2c3520" stroke-width="2"/>
<text x="755.3333333333334" y="1702" font-family="'Segoe UI',Arial,sans-serif" font-size="22" font-weight="700" fill="#f4f1e0" text-anchor="start">Plot fuse fee</text>

<text x="70" y="1892" font-family="'Arial Black','Segoe UI',Impact,sans-serif" font-size="40" font-weight="900" fill="#c3ced4" text-anchor="start" letter-spacing="1">3. ONE CONTRACT SPLITS IT</text>
<text x="70" y="1926" font-family="'Segoe UI',Arial,sans-serif" font-size="20" font-weight="400" fill="#83866a" text-anchor="start">RevenueRouter. No treasury wallet in the middle, and no discretion about where the money goes.</text>

<text x="110" y="2028" font-family="'Segoe UI',Arial,sans-serif" font-size="16" font-weight="700" fill="#c3ced4" text-anchor="start" letter-spacing="1.5">GUARDS BEFORE ANYTHING MOVES</text>
<text x="110" y="2068" font-family="'Segoe UI',Arial,sans-serif" font-size="19" font-weight="400" fill="#b9b89a" text-anchor="start">Max sweep</text>
<text x="110" y="2098" font-family="'Consolas','Courier New',monospace" font-size="26" font-weight="700" fill="#c3ced4" text-anchor="start">2,000,000 HESOYAM</text>
<text x="110" y="2126" font-family="'Segoe UI',Arial,sans-serif" font-size="15.5" font-weight="400" fill="#83866a" text-anchor="start">one sweep cannot dump the whole balance</text>
<text x="590" y="2068" font-family="'Segoe UI',Arial,sans-serif" font-size="19" font-weight="400" fill="#b9b89a" text-anchor="start">Cooldown</text>
<text x="590" y="2098" font-family="'Consolas','Courier New',monospace" font-size="26" font-weight="700" fill="#c3ced4" text-anchor="start">6 hours</text>
<text x="590" y="2126" font-family="'Segoe UI',Arial,sans-serif" font-size="15.5" font-weight="400" fill="#83866a" text-anchor="start">and cannot do it repeatedly</text>
<text x="1070" y="2068" font-family="'Segoe UI',Arial,sans-serif" font-size="19" font-weight="400" fill="#b9b89a" text-anchor="start">TWAP deviation</text>
<text x="1070" y="2098" font-family="'Consolas','Courier New',monospace" font-size="26" font-weight="700" fill="#c3ced4" text-anchor="start">at most 2%</text>
<text x="1070" y="2126" font-family="'Segoe UI',Arial,sans-serif" font-size="15.5" font-weight="400" fill="#83866a" text-anchor="start">refuses to swap into a manipulated price</text>
<line x1="110" y1="2172" x2="1990" y2="2172" stroke="#414d2e" stroke-width="2"/>
<text x="110" y="2208" font-family="'Segoe UI',Arial,sans-serif" font-size="16" font-weight="700" fill="#c3ced4" text-anchor="start" letter-spacing="1.5">THEN SWAP HESOYAM INTO THE SETTLEMENT TOKEN, THEN SPLIT</text>
<text x="110" y="2238" font-family="'Segoe UI',Arial,sans-serif" font-size="17.5" font-weight="400" fill="#b9b89a" text-anchor="start">Rewards are paid in a settlement token the treasury bought with money it earned, never in newly minted HESOYAM. The split below is stored on chain and must sum to exactly 10000 basis points.</text>

<text x="70" y="2544" font-family="'Arial Black','Segoe UI',Impact,sans-serif" font-size="40" font-weight="900" fill="#5fbf4a" text-anchor="start" letter-spacing="1">4. THE TWO RAILS THAT PAY YOU</text>
<text x="70" y="2578" font-family="'Segoe UI',Arial,sans-serif" font-size="20" font-weight="400" fill="#83866a" text-anchor="start">Half to the people who hold. Just over a quarter back to the people who grow.</text>

<text x="248" y="2686" font-family="'Segoe UI',Arial,sans-serif" font-size="28" font-weight="700" fill="#f4f1e0" text-anchor="start">The staker rail</text>
<text x="248" y="2714" font-family="'Consolas','Courier New',monospace" font-size="16" font-weight="400" fill="#83866a" text-anchor="start">StakingVault</text>
<text x="102" y="2756" font-family="'Segoe UI',Arial,sans-serif" font-size="17.5" font-weight="400" fill="#b9b89a" text-anchor="start">Revenue arrives as notifyReward and is spread across everyone's weight using an accumulator, so</text>
<text x="102" y="2781.375" font-family="'Segoe UI',Arial,sans-serif" font-size="17.5" font-weight="400" fill="#b9b89a" text-anchor="start">a deposit made after the money arrived cannot claim any of it.</text>
<text x="102" y="2824.75" font-family="'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="#5fbf4a" text-anchor="start" letter-spacing="1.2">WEIGHT = AMOUNT x LOCK MULTIPLIER x CARD BONUS</text>

<text x="320" y="2854.75" font-family="'Segoe UI',Arial,sans-serif" font-size="17" font-weight="400" fill="#83866a" text-anchor="start">no lock</text>
<text x="934" y="2854.75" font-family="'Consolas','Courier New',monospace" font-size="20" font-weight="700" fill="#5fbf4a" text-anchor="end">1.0x</text>
<text x="102" y="2884.75" font-family="'Segoe UI',Arial,sans-serif" font-size="18" font-weight="400" fill="#f4f1e0" text-anchor="start">Vegetative</text>
<text x="320" y="2884.75" font-family="'Segoe UI',Arial,sans-serif" font-size="17" font-weight="400" fill="#83866a" text-anchor="start">30 days</text>
<text x="934" y="2884.75" font-family="'Consolas','Courier New',monospace" font-size="20" font-weight="700" fill="#5fbf4a" text-anchor="end">1.3x</text>
<text x="102" y="2914.75" font-family="'Segoe UI',Arial,sans-serif" font-size="18" font-weight="400" fill="#f4f1e0" text-anchor="start">Flowering</text>
<text x="320" y="2914.75" font-family="'Segoe UI',Arial,sans-serif" font-size="17" font-weight="400" fill="#83866a" text-anchor="start">60 days</text>
<text x="934" y="2914.75" font-family="'Consolas','Courier New',monospace" font-size="20" font-weight="700" fill="#5fbf4a" text-anchor="end">1.8x</text>
<text x="102" y="2944.75" font-family="'Segoe UI',Arial,sans-serif" font-size="18" font-weight="400" fill="#f4f1e0" text-anchor="start">Canopy</text>
<text x="320" y="2944.75" font-family="'Segoe UI',Arial,sans-serif" font-size="17" font-weight="400" fill="#83866a" text-anchor="start">90 days</text>
<text x="934" y="2944.75" font-family="'Consolas','Courier New',monospace" font-size="20" font-weight="700" fill="#5fbf4a" text-anchor="end">2.5x</text>
<text x="102" y="2986.75" font-family="'Segoe UI',Arial,sans-serif" font-size="17" font-weight="400" fill="#83866a" text-anchor="start">Strain Cards raise it further. At most five equipped, and the total card bonus is capped at 4200</text>
<text x="102" y="3011.4" font-family="'Segoe UI',Arial,sans-serif" font-size="17" font-weight="400" fill="#83866a" text-anchor="start">basis points, so the leaderboard cannot simply be bought. Leaving a lock early costs 400 basis</text>
<text x="102" y="3036.05" font-family="'Segoe UI',Arial,sans-serif" font-size="17" font-weight="400" fill="#83866a" text-anchor="start">points.</text>

<text x="1102" y="2690" font-family="'Arial Black','Segoe UI',Impact,sans-serif" font-size="52" font-weight="900" fill="#e0913a" text-anchor="start">28%</text>
<text x="1248" y="2686" font-family="'Segoe UI',Arial,sans-serif" font-size="28" font-weight="700" fill="#f4f1e0" text-anchor="start">The grower rail</text>
<text x="1248" y="2714" font-family="'Consolas','Courier New',monospace" font-size="16" font-weight="400" fill="#83866a" text-anchor="start">Dispensary</text>
<text x="1102" y="2756" font-family="'Segoe UI',Arial,sans-serif" font-size="17.5" font-weight="400" fill="#b9b89a" text-anchor="start">The money funds an epoch budget, and the Dispensary uses it to bid for Flower. It opens above</text>
<text x="1102" y="2781.375" font-family="'Segoe UI',Arial,sans-serif" font-size="17.5" font-weight="400" fill="#b9b89a" text-anchor="start">market and falls across the day until the budget is spent or nobody sells.</text>
<text x="1102" y="2824.75" font-family="'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="#e0913a" text-anchor="start" letter-spacing="1.2">THE BID, ACROSS ONE 24 HOUR EPOCH</text>

<text x="1954" y="2996.75" font-family="'Consolas','Courier New',monospace" font-size="15" font-weight="400" fill="#e0913a" text-anchor="end">floors at 60% after 24h</text>
<text x="1114" y="2936.59" font-family="'Consolas','Courier New',monospace" font-size="14" font-weight="400" fill="#83866a" text-anchor="start">market reference</text>
<text x="1102" y="3036.75" font-family="'Segoe UI',Arial,sans-serif" font-size="17" font-weight="400" fill="#83866a" text-anchor="start">Spend can never exceed the budget, and the budget is only ever what the router actually delivered.</text>
<text x="1102" y="3061.4" font-family="'Segoe UI',Arial,sans-serif" font-size="17" font-weight="400" fill="#83866a" text-anchor="start">There is no guaranteed floor, because a guaranteed floor would need money nobody had earned yet.</text>
<rect x="70" y="3144" width="1960" height="190" rx="0" fill="#1f2516" stroke="#414d2e" stroke-width="2"/>
<text x="1050" y="3188" font-family="'Segoe UI',Arial,sans-serif" font-size="20" font-weight="700" fill="#f5c542" text-anchor="middle" letter-spacing="2">AND THAT IS WHAT SENDS YOU BACK TO STEP ONE</text>

<text x="176" y="3262" font-family="'Segoe UI',Arial,sans-serif" font-size="16.5" font-weight="400" fill="#5fbf4a" text-anchor="start">Stakers are paid in a settlement token, so holding and locking HESOYAM is worth more than</text>
<text x="176" y="3284" font-family="'Segoe UI',Arial,sans-serif" font-size="16.5" font-weight="400" fill="#5fbf4a" text-anchor="start">it was.</text>
<path d="M 1920 3236 L 1090 3236" fill="none" stroke="#e0913a" stroke-width="4" marker-end="url(#headAmber)"/>
<text x="1106" y="3262" font-family="'Segoe UI',Arial,sans-serif" font-size="16.5" font-weight="400" fill="#e0913a" text-anchor="start">Growers always have a buyer above market, so planting the next cycle is worth doing.</text>
<text x="70" y="3380" font-family="'Arial Black','Segoe UI',Impact,sans-serif" font-size="40" font-weight="900" fill="#f5c542" text-anchor="start" letter-spacing="1">5. WHY IT IS A WHEEL AND NOT A PIPE</text>
